@# Basic Parent-Child Router Tree Test Configuration
# This configuration tests basic parent-child router relationships with middleware inheritance

[entryPoints]
  [entryPoints.web]
    address = ":80"

[api]
  dashboard = true
  debug = true

# Test Services
[http.services]
  [http.services.public-service.loadBalancer]
    [[http.services.public-service.loadBalancer.servers]]
      url = "http://127.0.0.1:8080"

  [http.services.api-service.loadBalancer]
    [[http.services.api-service.loadBalancer.servers]]
      url = "http://127.0.0.1:8081"

# Test Middlewares
[http.middlewares]
  [http.middlewares.auth.basicAuth]
    users = ["admin:$2y$10$DjmdQxRwCk9DZ3JTL/nO8uBD3Mm7/.Vl8vu.1qWt9ZLqKaHJbXjhS"] # admin:password

  [http.middlewares.api-headers.headers.customRequestHeaders]
    X-API-Version = "v1"
    X-Forwarded-By = "traefik"

# Router Tree Test
[http.routers]
  # Parent router - provides authentication for all children
  [http.routers.auth-parent]
    entryPoints = ["web"]
    rule = "Host(`api.example.com`)"
    middlewares = ["auth"]

  # Child router - inherits auth from parent, adds API headers
  [http.routers.api-child]
    parentRefs = ["auth-parent"]
    rule = "PathPrefix(`/api`)"
    middlewares = ["api-headers"]
    service = "api-service"

  # Independent router - no parent, no auth required
  [http.routers.public-independent]
    entryPoints = ["web"]
    rule = "Host(`public.example.com`)"
    service = "public-service"
