# Authentication Pre-routing Test Configuration
# Comprehensive test including authentication, middleware inheritance, and header-based routing
# Based on quickstart example - tests authentication middleware applied at parent level

[entryPoints]
  [entryPoints.web]
    address = ":80"
  [entryPoints.websecure]
    address = ":443"

[api]
  dashboard = true
  debug = true

# Test Services
[http.services]
  [http.services.api-service.loadBalancer]
    [[http.services.api-service.loadBalancer.servers]]
      url = "http://127.0.0.1:3000"

  [http.services.admin-service.loadBalancer]
    [[http.services.admin-service.loadBalancer.servers]]
      url = "http://127.0.0.1:3001"

  [http.services.public-service.loadBalancer]
    [[http.services.public-service.loadBalancer.servers]]
      url = "http://127.0.0.1:3002"

  # Additional services for header-based routing tests
  [http.services.header-admin-service.loadBalancer]
    [[http.services.header-admin-service.loadBalancer.servers]]
      url = "http://127.0.0.1:3003"

  [http.services.header-user-service.loadBalancer]
    [[http.services.header-user-service.loadBalancer.servers]]
      url = "http://127.0.0.1:3004"

# Middleware definitions
[http.middlewares]
  [http.middlewares.auth.basicAuth]
    users = ["admin:$2y$10$DjmdQxRwCk9DZ3JTL/nO8uBD3Mm7/.Vl8vu.1qWt9ZLqKaHJbXjhS"] # admin:password

  [http.middlewares.api-headers.headers.customRequestHeaders]
    X-API-Version = "v1"

  [http.middlewares.admin-only.headers.customRequestHeaders]
    X-Admin = "true"

  # Header-based routing middleware
  [http.middlewares.add-auth-headers.headers.customRequestHeaders]
    X-User-Role = "admin"
    X-Auth-Status = "authenticated"

  [http.middlewares.log-headers.headers.customRequestHeaders]
    X-Processed = "true"

# Router tree
[http.routers]
  # Top-level router - applies auth to all children
  [http.routers.auth-router]
    entryPoints = ["web"]
    rule = "Host(`api.example.com`)"
    middlewares = ["auth"]

  # Child router - inherits auth, adds API headers
  [http.routers.api-router]
    parentRefs = ["auth-router"]
    rule = "PathPrefix(`/api`)"
    middlewares = ["api-headers"]
    service = "api-service"

  # Grandchild router - inherits auth and api-headers, adds admin-only
  [http.routers.admin-router]
    parentRefs = ["api-router"]
    rule = "Path(`/api/admin`)"
    middlewares = ["admin-only"]
    service = "admin-service"

  # Independent router - no auth required
  [http.routers.public-router]
    entryPoints = ["web"]
    rule = "Host(`public.example.com`)"
    service = "public-service"

  # Header-based routing test section
  # Parent router that adds headers for child routing decisions
  [http.routers.header-auth-parent]
    entryPoints = ["web"]
    rule = "Host(`header.example.com`)"
    middlewares = ["add-auth-headers"]

  # Child router using header added by parent for admin routing
  [http.routers.header-admin-child]
    parentRefs = ["header-auth-parent"]
    rule = "Header(`X-User-Role`, `admin`)"
    middlewares = ["log-headers"]
    service = "header-admin-service"

  # Child router for user routing based on headers
  [http.routers.header-user-child]
    parentRefs = ["header-auth-parent"]
    rule = "Header(`X-User-Role`, `user`)"
    service = "header-user-service"