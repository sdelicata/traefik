# Circular Dependency Test: 2 Routers
# This configuration should be REJECTED due to circular dependency

[entryPoints]
  [entryPoints.web]
    address = ":80"

[api]
  dashboard = true
  debug = true

# Test Services
[http.services]
  [http.services.service-a.loadBalancer]
    [[http.services.service-a.loadBalancer.servers]]
      url = "http://127.0.0.1:8001"

  [http.services.service-b.loadBalancer]
    [[http.services.service-b.loadBalancer.servers]]
      url = "http://127.0.0.1:8002"

# Circular dependency: router-a → router-b → router-a
[http.routers]
  [http.routers.router-a]
    entryPoints = ["web"]
    parentRefs = ["router-b"]  # Creates circular dependency
    rule = "Host(`a.example.com`)"
    service = "service-a"

  [http.routers.router-b]
    entryPoints = ["web"]
    parentRefs = ["router-a"]  # Creates circular dependency
    rule = "Host(`b.example.com`)"
    service = "service-b"