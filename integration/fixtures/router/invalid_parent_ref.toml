# Invalid Parent Reference Test Configuration
# This configuration should be REJECTED due to non-existent parent router

[entryPoints]
  [entryPoints.web]
    address = ":80"

[api]
  dashboard = true
  debug = true

# Test Services
[http.services]
  [http.services.child-service.loadBalancer]
    [[http.services.child-service.loadBalancer.servers]]
      url = "http://127.0.0.1:8001"

  [http.services.valid-parent-service.loadBalancer]
    [[http.services.valid-parent-service.loadBalancer.servers]]
      url = "http://127.0.0.1:8002"

# Router configuration with invalid parent reference
[http.routers]
  # Valid parent router
  [http.routers.valid-parent]
    entryPoints = ["web"]
    rule = "Host(`valid.example.com`)"
    service = "valid-parent-service"

  # Child with invalid parent reference
  [http.routers.invalid-child]
    parentRefs = ["non-existent-parent"]  # This parent doesn't exist
    rule = "Path(`/invalid`)"
    service = "child-service"

  # Child with mix of valid and invalid parent references
  [http.routers.mixed-invalid-child]
    parentRefs = ["valid-parent", "another-non-existent-parent"]
    rule = "Path(`/mixed-invalid`)"
    service = "child-service"