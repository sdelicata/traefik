# Circular Dependency Test: 3 Routers (3-loop limit)
# This configuration should be REJECTED due to circular dependency at the 3-loop limit

[entryPoints]
  [entryPoints.web]
    address = ":80"

[api]
  dashboard = true
  debug = true

# Test Services
[http.services]
  [http.services.service-a.loadBalancer]
    [[http.services.service-a.loadBalancer.servers]]
      url = "http://127.0.0.1:8001"

  [http.services.service-b.loadBalancer]
    [[http.services.service-b.loadBalancer.servers]]
      url = "http://127.0.0.1:8002"

  [http.services.service-c.loadBalancer]
    [[http.services.service-c.loadBalancer.servers]]
      url = "http://127.0.0.1:8003"

# Circular dependency: router-a → router-b → router-c → router-a (3 loops)
[http.routers]
  [http.routers.router-a]
    entryPoints = ["web"]
    parentRefs = ["router-c"]  # Creates 3-loop circular dependency
    rule = "Host(`a.example.com`)"
    service = "service-a"

  [http.routers.router-b]
    entryPoints = ["web"]
    parentRefs = ["router-a"]
    rule = "Host(`b.example.com`)"
    service = "service-b"

  [http.routers.router-c]
    entryPoints = ["web"]
    parentRefs = ["router-b"]
    rule = "Host(`c.example.com`)"
    service = "service-c"